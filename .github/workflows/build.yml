name: Build and Sign aDhizuku

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Build Tools
        uses: android-actions/setup-android@v3

      - name: Decode Signing Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.p12
          ls -lh release.p12

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        uses: ralfirza/apk-signer-action@v1.0.1
        with:
          apk-path: app/build/outputs/apk/release/*.apk
          key-store: release.p12
          key-store-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release/ -type f -name "*signed*.apk" -exec cp {} dist/aDhizuku-release.apk \;
          ls -la dist/

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aDhizuku-signed
          path: dist/*.apk
          retention-days: 14
