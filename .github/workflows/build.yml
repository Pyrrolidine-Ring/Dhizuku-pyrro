name: Build and Sign aDhizuku

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -x lint -x lintVitalRelease --stacktrace

      - name: Decode Keystore and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          echo "$KEYSTORE_BASE64" | base64 -d > release.p12
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found compiled APK: $UNSIGNED_APK"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" dist/aDhizuku-aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign --ks release.p12 \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/aDhizuku-release.apk \
            dist/aDhizuku-aligned.apk
            
          $BUILD_TOOLS_DIR/apksigner verify --verbose dist/aDhizuku-release.apk
          rm -f release.p12 dist/aDhizuku-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aDhizuku-signed
          path: dist/aDhizuku-release.apk
          retention-days: 14
